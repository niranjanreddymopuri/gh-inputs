name: Inputs test file
on:
    workflow_dispatch:
        inputs:
            synapse_name:
                description: Takes the name of the synapse
                required: true
                default: "Synw-k2c-prod-weu-001"
                type: string
            log-level:
                description: filter the logs
                required: false
                default: warning
                type: choice
                options:
                    - warning
                    - info
                    - debug
jobs:
    Print:
     runs-on: ubuntu-latest
     if: ${{github.event.inputs.synapse_name}} != ''
     steps:
        - name: print the name of the synapse
          run: |
            echo "The synapse name is ${{github.event.inputs.synapse_name}}"